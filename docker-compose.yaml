version: "3.3"

services:
  postgres-db:
    image: postgres:15.5-alpine
    container_name: postgres-db
    ports:
      - "5432:5432"
    volumes:
      - ./db/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    environment:
      - POSTGRES_DB=healenium
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    networks:
      - healenium

  healenium:
    image: healenium/hlm-backend:3.4.3
    container_name: healenium
    restart: always
    ports:
      - "7878:7878"
    links:
      - postgres-db
    environment:
      - SPRING_POSTGRES_DB=healenium
      # Alterado para casar com o dono do banco global
      - SPRING_POSTGRES_SCHEMA=public
      - SPRING_POSTGRES_USER=postgres
      - SPRING_POSTGRES_PASSWORD=postgres
      - SPRING_POSTGRES_DB_HOST=postgres-db
      # ADICIONADO: Comando Master para guiar as tabelas do Liquibase para a zona livre
      - SPRING_LIQUIBASE_DEFAULT_SCHEMA=public
      - KEY_SELECTOR_URL=false
      - COLLECT_METRICS=true
      - FIND_ELEMENTS_AUTO_HEALING=false
      - HLM_LOG_LEVEL=info
    volumes:
      - ./screenshots/:/screenshots
      - ./logs/:/logs
    networks:
      - healenium

  selector-imitator:
    image: healenium/hlm-selector-imitator:1.3
    container_name: selector-imitator
    restart: on-failure
    ports:
      - "8000:8000"
    networks:
      - healenium

networks:
  healenium: